name: Diagnose play counts

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Comma-separated track name substrings (case-insensitive)"
        required: true
        default: "Dai Dai"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Validate secrets
        run: |
          missing=0
          [ -z "${{ secrets.SSH_HOST }}" ] && echo "::error::SSH_HOST secret is empty or missing" && missing=1
          [ -z "${{ secrets.SSH_USER }}" ] && echo "::error::SSH_USER secret is empty or missing" && missing=1
          [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ] && echo "::error::SSH_PRIVATE_KEY secret is empty or missing" && missing=1
          exit $missing

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Query production DB
        env:
          QUERY: ${{ inputs.query }}
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "QUERY=$(printf %q "$QUERY") bash -s" <<'EOF'
          set -euo pipefail
          cd ~/FixSpotify

          SCRIPT=$(mktemp)
          cat > "$SCRIPT" <<'NODE'
          import Database from "better-sqlite3";

          const db = new Database("/app/data/prod.db", { readonly: true });
          const queries = String(process.env.QUERY || "")
            .split(",")
            .map((q) => q.trim())
            .filter(Boolean);

          function normalizeTitle(name) {
            return name
              .toLowerCase()
              .normalize("NFKD")
              .replace(/[\u0300-\u036f]/g, "")
              .replace(/[^\p{L}\p{N}]+/gu, " ")
              .trim();
          }
          function softNormalizeTitle(name) {
            const withoutSoundtrack = name
              .replace(/\(\s*from\b[^)]*\)/gi, " ")
              .replace(/\s*[-\u2013\u2014]\s*from\b.*$/gi, " ")
              .replace(/\s+from\s+['\u2018\u2019\u201c\u201d"].*$/gi, " ");
            return normalizeTitle(withoutSoundtrack)
              .replace(
                /\b(remaster(?:ed)?|deluxe(?: edition)?|radio edit|radio version|mtv unplugged|unplugged|summer solstice|acoustic(?: version)?|live(?: version)?|mono|stereo|feat(?:uring)?|ft)\b/gu,
                " ",
              )
              .replace(/\s+/g, " ")
              .trim();
          }
          function canonicalizeMashupKey(key) {
            const parts = key
              .split(/\bx\b/g)
              .map((part) => part.trim())
              .filter(Boolean);
            if (parts.length < 2) return key;
            return [...parts].sort((a, b) => a.localeCompare(b)).join(" x ");
          }
          function softTitleKey(name) {
            const key = softNormalizeTitle(name)
              .replace(/\b(original|single|album|extended|soundtrack|ost)\b/gu, " ")
              .replace(/\bseason\s*\d+\b/gu, " ")
              .replace(/\b((?:19|20)\d{2})\b/g, " ")
              .replace(/\s+/g, " ")
              .trim();
            return canonicalizeMashupKey(key);
          }
          function softNormalizeArtist(name) {
            return normalizeTitle(name)
              .replace(/\b(feat(?:uring)?|ft|with)\b/gu, " ")
              .replace(/\s+/g, " ")
              .trim();
          }
          function artistsMatch(play, artistIds, artistNames) {
            if (play.artistId && play.artistId !== "unknown") {
              if (artistIds.includes(play.artistId)) return true;
            }
            const playArtist = softNormalizeArtist(play.artistName);
            if (!playArtist) return false;
            return artistNames.some((name) => {
              const playlistArtist = softNormalizeArtist(name);
              if (!playlistArtist) return false;
              return (
                playlistArtist === playArtist ||
                playlistArtist.includes(playArtist) ||
                playArtist.includes(playlistArtist) ||
                artistInitialsMatch(playArtist, playlistArtist)
              );
            });
          }
          function isDistinctiveTitle(key) {
            const tokens = key.split(" ").filter(Boolean);
            return key.length >= 11 && tokens.length >= 2;
          }
          function compactArtistInitials(name) {
            const tokens = name.split(" ").filter(Boolean);
            if (tokens.length === 1 && /^[a-z]{2,4}$/.test(tokens[0])) return tokens[0];
            return null;
          }
          function expandedArtistInitials(name) {
            const tokens = name.split(" ").filter(Boolean);
            if (tokens.length < 2 || tokens.some((t) => t.length < 5)) return null;
            return tokens.map((t) => t[0]).join("");
          }
          function artistInitialsMatch(a, b) {
            const compactA = compactArtistInitials(a);
            const compactB = compactArtistInitials(b);
            const expandedA = expandedArtistInitials(a);
            const expandedB = expandedArtistInitials(b);
            return Boolean(
              (compactA && expandedB && compactA === expandedB) ||
                (compactB && expandedA && compactB === expandedA),
            );
          }
          function titleTokensWrapped(needle, haystack) {
            if (needle.length < 8) return false;
            const n = needle.split(" ").filter(Boolean);
            const h = haystack.split(" ").filter(Boolean);
            if (!n.length || n.length + 2 > h.length) return false;
            for (let i = 1; i <= h.length - n.length - 1; i++) {
              if (n.every((tok, j) => h[i + j] === tok)) return true;
            }
            return false;
          }
          function titlesLooselyMatch(a, b) {
            if (!a || !b) return false;
            if (a === b) return true;
            if (titleTokensWrapped(a, b) || titleTokensWrapped(b, a)) return true;
            if (Math.min(a.length, b.length) < 10) return false;
            if (Math.abs(a.length - b.length) > 1) return false;
            // cheap levenshtein <= 1
            let i = 0, j = 0, edits = 0;
            while (i < a.length && j < b.length) {
              if (a[i] === b[j]) { i++; j++; continue; }
              edits++;
              if (edits > 1) return false;
              if (a.length > b.length) i++;
              else if (b.length > a.length) j++;
              else { i++; j++; }
            }
            edits += a.length - i + b.length - j;
            return edits <= 1;
          }
          function aggregateByTrackId(groups) {
            const byTrackId = new Map();
            for (const group of groups) {
              const existing = byTrackId.get(group.trackId);
              if (!existing) {
                byTrackId.set(group.trackId, {
                  trackId: group.trackId,
                  trackName: group.trackName,
                  count: group.count,
                  variants: [group],
                });
                continue;
              }
              existing.count += group.count;
              existing.variants.push(group);
            }
            return Array.from(byTrackId.values());
          }

          const caches = db.prepare("SELECT playlistId, tracks FROM PlaylistTrackCache").all();
          const allTracks = [];
          for (const row of caches) {
            let tracks;
            try { tracks = JSON.parse(row.tracks); } catch { continue; }
            for (const t of tracks) {
              allTracks.push({
                playlistId: row.playlistId,
                id: t.id,
                name: String(t.name || ""),
                artistIds: (t.artists || []).map((a) => a.id).filter(Boolean),
                artistNames: (t.artists || []).map((a) => a.name).filter(Boolean),
              });
            }
          }

          const playGroups = db.prepare(`
            SELECT trackId, trackName, artistId, artistName, COUNT(*) AS n
            FROM Play
            GROUP BY trackId, trackName, artistId, artistName
          `).all().map((g) => ({
            trackId: g.trackId,
            trackName: g.trackName,
            artistId: g.artistId,
            artistName: g.artistName,
            count: g.n,
          }));
          const aggregated = aggregateByTrackId(playGroups);
          const aliasBuckets = new Map();
          for (const play of aggregated) {
            const key = softTitleKey(play.trackName);
            if (!key) continue;
            const entries = aliasBuckets.get(key) ?? [];
            entries.push(play);
            aliasBuckets.set(key, entries);
          }
          const aliasKeys = Array.from(aliasBuckets.keys());

          function mergedCount(track) {
            let count = db.prepare("SELECT COUNT(*) AS n FROM Play WHERE trackId = ?").get(track.id).n;
            const counted = new Set([track.id]);
            const key = softTitleKey(track.name);
            if (!key) return { count, key, exact: count };
            const exact = count;
            for (const candidateKey of aliasKeys) {
              if (!titlesLooselyMatch(key, candidateKey)) continue;
              for (const candidate of aliasBuckets.get(candidateKey) ?? []) {
                if (counted.has(candidate.trackId)) continue;
                const artistOk = candidate.variants.some((v) =>
                  artistsMatch(v, track.artistIds, track.artistNames),
                );
                if (!artistOk && (candidateKey === key || !isDistinctiveTitle(key))) continue;
                counted.add(candidate.trackId);
                count += candidate.count;
              }
            }
            return { count, key, exact };
          }

          for (const query of queries) {
            console.log("\n==== QUERY:", query, "====");
            const q = query.toLowerCase();
            const hits = allTracks.filter((t) => t.name.toLowerCase().includes(q));
            // Prefer modern-pop-ish / unique hits; print all playlist hits
            if (hits.length === 0) {
              console.log("PLAYLIST_HITS: none");
            }
            for (const hit of hits) {
              const related = playGroups.filter((g) =>
                softTitleKey(g.trackName).includes(softTitleKey(hit.name).slice(0, 8)) ||
                g.trackName.toLowerCase().includes(q) ||
                softTitleKey(g.trackName) === softTitleKey(hit.name)
              );
              // tighter related: same soft key loosely or name contains query
              const relatedTight = playGroups.filter((g) => {
                const gk = softTitleKey(g.trackName);
                const hk = softTitleKey(hit.name);
                return (
                  g.trackName.toLowerCase().includes(q) ||
                  (hk && gk && titlesLooselyMatch(hk, gk))
                );
              });
              const merged = mergedCount(hit);
              console.log(JSON.stringify({
                playlistId: hit.playlistId,
                id: hit.id,
                name: hit.name,
                artists: hit.artistNames.join(", "),
                exactIdPlays: merged.exact,
                softKey: merged.key,
                mergedSoftCount: merged.count,
                relatedPlays: relatedTight.map((g) => ({
                  trackId: g.trackId,
                  name: g.trackName,
                  artist: g.artistName,
                  n: g.count,
                  softKey: softTitleKey(g.trackName),
                })),
              }, null, 2));
            }

            // Also show history matches even if not on a playlist
            const historyOnly = playGroups.filter((g) =>
              g.trackName.toLowerCase().includes(q)
            );
            if (hits.length === 0 && historyOnly.length) {
              console.log("HISTORY_ONLY", JSON.stringify(historyOnly.map((g) => ({
                trackId: g.trackId,
                name: g.trackName,
                artist: g.artistName,
                n: g.count,
                softKey: softTitleKey(g.trackName),
              })), null, 2));
            }
          }

          const newest = db.prepare(
            "SELECT playedAt, trackName FROM Play ORDER BY playedAt DESC LIMIT 1",
          ).get();
          console.log("\nNEWEST_PLAY", JSON.stringify(newest));
          console.log("TOTAL_PLAYS", db.prepare("SELECT COUNT(*) AS n FROM Play").get().n);
          NODE

          docker compose --env-file .env.production exec -T -e QUERY="$QUERY" app \
            node --input-type=module < "$SCRIPT"
          rm -f "$SCRIPT"
          EOF
