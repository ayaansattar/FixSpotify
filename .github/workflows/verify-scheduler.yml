name: Verify scheduler

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Validate secrets
        run: |
          missing=0
          [ -z "${{ secrets.SSH_HOST }}" ] && echo "::error::SSH_HOST secret is empty or missing" && missing=1
          [ -z "${{ secrets.SSH_USER }}" ] && echo "::error::SSH_USER secret is empty or missing" && missing=1
          [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ] && echo "::error::SSH_PRIVATE_KEY secret is empty or missing" && missing=1
          exit $missing

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Check app container and scheduler logs
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -s <<'EOF'
          set -euo pipefail
          cd ~/FixSpotify

          echo "=== compose ps ==="
          docker compose --env-file .env.production ps

          echo ""
          echo "=== recent app logs (scheduler / sync / Ready) ==="
          docker compose --env-file .env.production logs --tail=300 app 2>&1 \
            | grep -E 'scheduler|Synced plays|Ready|error|Error|instrumentation' \
            || true

          echo ""
          echo "=== last 40 app log lines ==="
          docker compose --env-file .env.production logs --tail=40 app
          EOF
